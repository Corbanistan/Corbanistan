name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches: ["main", "master"]

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          plugin_languages_sections: most-used
          config_theme: tokyonight
          output_action: none

      - name: Move Metrics SVG to root
        run: |
          if [ -f metrics_renders/github-metrics.svg ]; then
            mv metrics_renders/github-metrics.svg ./github-metrics.svg
          elif [ -f /metrics_renders/github-metrics.svg ]; then
            mv /metrics_renders/github-metrics.svg ./github-metrics.svg
          fi

      - name: Generate Snake Animation
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      - name: Commit updated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile metrics & snake animation [skip ci]"
          file_pattern: "*.svg"
